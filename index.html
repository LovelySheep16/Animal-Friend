<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Animal Friend RPG - 50 Levels & 50 Pets</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0010;font-family:'Courier New',monospace;overflow:hidden;user-select:none;}
#wrap{position:relative;width:100vw;height:100vh;}
canvas{display:block;position:absolute;top:0;left:0;}
#hud{position:absolute;top:0;left:0;width:100%;display:flex;gap:10px;align-items:center;padding:5px 10px;background:rgba(0,0,0,0.85);border-bottom:1px solid #5020a0;flex-wrap:wrap;z-index:5;}
.stat{font-size:11px;color:#e0d0ff;}.lbl{color:#8050b0;font-size:9px;}
#hpbar{width:90px;height:8px;background:#300;border-radius:4px;overflow:hidden;}
#hpfill{height:100%;background:#f84;border-radius:4px;transition:width .15s;}
#petbar{display:flex;gap:2px;flex-wrap:wrap;max-width:300px;}
.pi{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;border:1px solid #5020a0;background:rgba(50,10,90,.9);}
#ov,#gov,#wov{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:flex-start;z-index:20;overflow-y:auto;padding:10px;}
.otitle{font-size:22px;color:#c080ff;margin-bottom:4px;position:sticky;top:0;background:rgba(0,0,0,.97);padding:8px 0;width:100%;text-align:center;z-index:2;}
.scat{font-size:11px;color:#a070d0;margin:8px 0 4px;width:100%;max-width:680px;text-align:left;padding-left:4px;border-left:3px solid #6030a0;}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:680px;width:100%;}
.sc{background:rgba(35,10,65,.95);border:1px solid #5020a0;border-radius:8px;padding:7px;text-align:center;cursor:pointer;transition:all .12s;}
.sc:hover{border-color:#b070ff;transform:scale(1.03);}
.sc.own{border-color:#30a050;background:rgba(10,45,20,.95);cursor:default;}
.sc.ca{opacity:.4;cursor:not-allowed;}
.pe{font-size:22px;margin-bottom:2px;}.pn{color:#e0d0ff;font-size:10px;font-weight:bold;}
.pd{color:#7050a0;font-size:9px;margin:2px 0;line-height:1.3;}.pc{color:#ffd700;font-size:10px;}
.btn{padding:6px 18px;background:#4a1898;border:1px solid #7030c0;border-radius:7px;color:#e0d0ff;font-family:'Courier New',monospace;font-size:12px;cursor:pointer;margin-top:4px;}
.btn:hover{background:#6828d0;}.btng{background:#184a18;border-color:#30903a;}.btng:hover{background:#205a20;}
#banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;color:#ffd700;pointer-events:none;opacity:0;transition:opacity .4s;background:rgba(0,0,0,.92);padding:10px 22px;border-radius:10px;border:2px solid #c08000;white-space:nowrap;z-index:15;}
#shopbtn{position:absolute;bottom:5px;right:8px;z-index:6;}
#lvlmap{position:absolute;bottom:5px;left:8px;color:#7050a0;font-size:8px;z-index:6;letter-spacing:.3px;max-width:60%;}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="hud">
  <div class="stat"><div class="lbl">HP</div><div id="hpbar"><div id="hpfill"></div></div></div>
  <div class="stat"><div class="lbl">LEVEL</div><span id="ltxt">1/50</span></div>
  <div class="stat"><div class="lbl">ZONE</div><span id="ztxt" style="color:#c0a0ff">-</span></div>
  <div class="stat"><div class="lbl">GEMS</div><span id="gtxt" style="color:#ffd700">0💎</span></div>
  <div class="stat"><div class="lbl">SCORE</div><span id="stxt">0</span></div>
  <div class="stat"><div class="lbl">ENEMIES</div><span id="etxt" style="color:#ff8080">0</span></div>
  <div class="stat" style="margin-left:auto"><div class="lbl">PETS</div><div id="petbar"></div></div>
</div>
<div id="banner"></div>
<div id="shopbtn"><button class="btn" onclick="openShop()" style="font-size:10px;padding:4px 10px">🛒 SHOP (50 pets!)</button></div>
<div id="lvlmap"></div>

<div id="ov">
  <div class="otitle">🛒 Pet Shop — <span id="sglbl">0💎</span></div>
  <div id="sgrid"></div>
  <button class="btn" style="margin:12px auto;display:block" onclick="closeShop()">▶ Back to Game</button>
</div>
<div id="gov">
  <div class="otitle" style="color:#ff4040">💀 YOU DIED</div>
  <div style="color:#8060a0;font-size:13px;margin-bottom:4px">Level reached: <span id="glvl" style="color:#ffd700"></span></div>
  <div style="color:#8060a0;font-size:13px;margin-bottom:14px">Gems collected: <span id="ggems" style="color:#ffd700"></span></div>
  <button class="btn" onclick="restart()">Try Again</button>
</div>
<div id="wov">
  <div class="otitle" style="color:#ffd700">🏆 ULTIMATE CHAMPION!</div>
  <div style="color:#c080ff;font-size:13px;margin-bottom:6px">All 50 dungeons conquered!</div>

  <button class="btn btng" onclick="restart()">Play Again</button>
</div>
</div>

function lvlDef(lv){
  var zone=ZONES[Math.min(lv,49)];
  // Gradually unlock more monster types
  var pct=(lv+1)/50;
  var pe=Math.min(MONS.length,Math.max(2,Math.ceil(pct*MONS.length)));
  var ps=Math.max(0,pe-Math.min(6,pe));
  var pool=MONS.slice(ps,pe);
  var count=4+Math.floor(lv*0.6);
  return{name:'Level '+(lv+1)+': '+zone.n,zone:zone,pool:pool,count:count,li:lv%5};
}

var keys={};
window.addEventListener('keydown',function(e){keys[e.code]=true;e.preventDefault();});
window.addEventListener('keyup',function(e){keys[e.code]=false;});

function Game(){
  this.lv=0;this.gems=0;this.score=0;
  this.pets=[];this.ptim={};this.patk={};
  this.open=false;this.dead=false;this.win=false;this.trans=false;
  this.parts=[];this.floats=[];this.fx=[];
  this.t0=Date.now();this.help=true;
  this.ld=null;this.map=null;this.mons=[];
  this.p=null;this.aa=0;this.C=0;this.R=0;
  this.build();this.showBanner();
}

Game.prototype.build=function(){
  this.ld=lvlDef(this.lv);
  this.C=Math.floor(canvas.width/T);this.R=Math.floor(GH/T);
  this.map=this.genMap(this.ld.li,this.C,this.R);
  this.p={x:T*2+T/2,y:GT+T*2+T/2,hp:100,mhp:100,atk:false,at:0,dir:1,inv:0};
  this.mons=this.spawnMons();this.aa=0;
  var n=Date.now();
  for(var i=0;i<this.pets.length;i++){var pt=this.pets[i];if(!this.patk[pt.id])this.patk[pt.id]=n;if(pt.hi>0&&!this.ptim[pt.id])this.ptim[pt.id]=n;}
};

Game.prototype.genMap=function(li,C,R){
  var m=[],r,c,idx;
  for(r=0;r<R;r++){m[r]=[];for(c=0;c<C;c++)m[r][c]=(r===0||r===R-1||c===0||c===C-1)?1:0;}
  var ws=[],mc,mr;
  if(li===0){
    mc=Math.floor(C/2);mr=Math.floor(R/2);
    for(r=2;r<R-2;r++)ws.push([r,mc]);
    [mr-1,mr,mr+1].forEach(function(rr){var i=ws.findIndex(function(x){return x[0]===rr&&x[1]===mc;});if(i>-1)ws.splice(i,1);});
    for(c=3;c<C-3;c++)ws.push([mr,c]);
    for(c=mc-2;c<=mc+2;c++){idx=ws.findIndex(function(x){return x[0]===mr&&x[1]===c;});if(idx>-1)ws.splice(idx,1);}
  }else if(li===1){
    [Math.floor(C/3),Math.floor(2*C/3)].forEach(function(xc){for(var xr=1;xr<R-1;xr++)if(Math.abs(xr-Math.floor(R/2))>2)ws.push([xr,xc]);});
  }else if(li===2){
    for(r=2;r<R-2;r++){if(r%4!==0)ws.push([r,Math.floor(C*.33)]);if(r%4!==2)ws.push([r,Math.floor(C*.67)]);}
  }else if(li===3){
    [[Math.floor(R/4),Math.floor(C/4)],[Math.floor(R/4),Math.floor(3*C/4)],[Math.floor(3*R/4),Math.floor(C/4)],[Math.floor(3*R/4),Math.floor(3*C/4)]].forEach(function(bc){for(var dr=-2;dr<=2;dr++)for(var dc=-2;dc<=2;dc++)if(Math.abs(dr)+Math.abs(dc)>1)ws.push([bc[0]+dr,bc[1]+dc]);});
  }else{
    for(var i=0;i<Math.floor(R/3);i++)ws.push([i*3+2,Math.floor(C/3)+(i%2)*Math.floor(C/3)]);
  }
  ws.forEach(function(w){if(w[0]>0&&w[0]<R-1&&w[1]>0&&w[1]<C-1)m[w[0]][w[1]]=1;});
  return m;
};

Game.prototype.spawnMons=function(){
  var sc=1+this.lv*0.06,pool=this.ld.pool,count=this.ld.count,arr=[];
  for(var i=0;i<count;i++){var md=pool[Math.floor(Math.random()*pool.length)],pos=this.rf();arr.push({t:md.t,hp:Math.round(md.hp*sc),mhp:Math.round(md.hp*sc),atk:Math.round(md.atk*sc),spd:md.spd,gem:md.gem,e:md.e,x:pos.x,y:pos.y,at:0,mt:0,dx:0,dy:0,dead:false});}
  return arr;
};

Game.prototype.rf=function(){
  var px=this.p?this.p.x:T*3,py=this.p?this.p.y:GT+T*3;
  for(var i=0;i<300;i++){var c=1+Math.floor(Math.random()*(this.C-2)),r=1+Math.floor(Math.random()*(this.R-2));if(!this.map[r][c]){var x=c*T+T/2,y=GT+r*T+T/2;if(Math.hypot(x-px,y-py)>T*5)return{x:x,y:y};}}
  return{x:T*8,y:GT+T*5};
};

Game.prototype.tile=function(x,y){var c=Math.floor(x/T),r=Math.floor((y-GT)/T);if(r<0||r>=this.R||c<0||c>=this.C)return 1;return this.map[r][c];};
Game.prototype.mv=function(e,dx,dy,sp,dt){var nx=e.x+dx*sp*dt,ny=e.y+dy*sp*dt,h=14;if(!this.tile(nx,e.y-h)&&!this.tile(nx,e.y+h))e.x=nx;if(!this.tile(e.x,ny-h)&&!this.tile(e.x,ny+h))e.y=ny;e.x=Math.max(h,Math.min(canvas.width-h,e.x));e.y=Math.max(GT+h,Math.min(GT+GH-h,e.y));};

Game.prototype.update=function(dt){
  if(this.open||this.dead||this.win||this.trans)return;
  var p=this.p,dx=0,dy=0,self=this;
  if(keys.ArrowLeft||keys.KeyA){dx=-1;p.dir=-1;}if(keys.ArrowRight||keys.KeyD){dx=1;p.dir=1;}
  if(keys.ArrowUp||keys.KeyW)dy=-1;if(keys.ArrowDown||keys.KeyS)dy=1;
  if(dx&&dy){dx*=.707;dy*=.707;}
  this.mv(p,dx,dy,185,dt);
  p.at=Math.max(0,p.at-dt*1000);
  if(keys.Space&&p.at<=0){p.atk=true;p.at=380;this.aa=280;this.doAtk();}
  if(p.at<=0)p.atk=false;
  this.aa=Math.max(0,this.aa-dt*1000);
  if(p.inv>0)p.inv-=dt*1000;
  this.mons.forEach(function(m){
    if(m.dead)return;
    m.mt-=dt*1000;
    if(m.mt<=0){var a=Math.atan2(p.y-m.y,p.x-m.x)+(Math.random()-.5)*.9;m.dx=Math.cos(a);m.dy=Math.sin(a);m.mt=500+Math.random()*500;}
    self.mv(m,m.dx,m.dy,m.spd,dt);
    if(Math.hypot(m.x-p.x,m.y-p.y)<32){
      m.at-=dt*1000;
      if(m.at<=0){
        m.at=1100;
        if(p.inv<=0){
          var sh=self.pets.find(function(pt){return pt.sc>0;});
          if(sh&&Math.random()<sh.sc){self.fl(p.x,p.y,'BLOCKED!','#40c8ff');return;}
          p.hp=Math.max(0,p.hp-m.atk);p.inv=350;
          self.burst(p.x,p.y,'#ff3333',6);self.fl(p.x,p.y,'-'+m.atk,'#ff4444');
          if(p.hp<=0){self.dead=true;self.showDead();}
        }
      }
    }
  });
  var now=Date.now();
  this.pets.forEach(function(pt){
    if(pt.hi>0&&pt.heal>0){if(!self.ptim[pt.id])self.ptim[pt.id]=now;if(now-self.ptim[pt.id]>=pt.hi){self.ptim[pt.id]=now;p.hp=Math.min(p.mhp,p.hp+pt.heal);self.fl(p.x+Math.random()*30-15,p.y-25,'+'+pt.heal+'❤','#30ff70');}}
    if(pt.atk>0&&pt.ar>0){
      if(!self.patk[pt.id])self.patk[pt.id]=now;
      if(now-self.patk[pt.id]>=pt.ar){
        self.patk[pt.id]=now;
        var al=self.mons.filter(function(m){return !m.dead;});
        if(al.length){var tg=al.reduce(function(a,b){return Math.hypot(a.x-p.x,a.y-p.y)<Math.hypot(b.x-p.x,b.y-p.y)?a:b;});if(Math.hypot(tg.x-p.x,tg.y-p.y)<240){tg.hp-=pt.atk;var fc=pt.id==='dragon'?'#ff7700':pt.id==='god'?'#ffff00':pt.id==='cerberus'?'#ff4400':'#70b0ff';self.fx.push({x1:p.x,y1:p.y,x2:tg.x,y2:tg.y,l:200,c:fc});self.fl(tg.x,tg.y,'-'+pt.atk,'#ffd700');if(tg.hp<=0)self.kill(tg);}}
      }
    }
  });
  this.parts=this.parts.filter(function(pt){pt.x+=pt.vx*.016;pt.y+=pt.vy*.016;pt.l-=dt*1000;return pt.l>0;});
  this.floats=this.floats.filter(function(f){f.y-=dt*42;f.l-=dt*1000;return f.l>0;});
  this.fx=this.fx.filter(function(f){f.l-=dt*1000;return f.l>0;});
  this.mons=this.mons.filter(function(m){return !m.dead;});
  if(this.mons.length===0&&!this.trans){
    this.trans=true;
    if(this.lv<49){this.lv++;this.showBanner();var s2=this;setTimeout(function(){s2.build();s2.trans=false;},1800);}
    else{this.win=true;document.getElementById('wscore').textContent=this.score;document.getElementById('wov').style.display='flex';}
  }
  this.hud();
};

Game.prototype.doAtk=function(){var p=this.p,dmg=20+this.lv,self=this;this.mons.forEach(function(m){if(m.dead||Math.hypot(m.x-p.x,m.y-p.y)>68)return;m.hp-=dmg;self.fx.push({x1:p.x,y1:p.y,x2:m.x,y2:m.y,l:180,c:'#fff'});self.fl(m.x,m.y,'-'+dmg,'#fff');if(m.hp<=0)self.kill(m);});this.burst(p.x+p.dir*26,p.y,'#fff',3);};
Game.prototype.kill=function(m){if(m.dead)return;m.dead=true;this.gems+=m.gem;this.score+=m.gem*10;this.burst(m.x,m.y,'#ffd700',10);this.fl(m.x,m.y,'+'+m.gem+'💎','#ffd700');};
Game.prototype.burst=function(x,y,c,n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=40+Math.random()*80;this.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:c,l:350+Math.random()*280,sz:2+Math.random()*2.5});}};
Game.prototype.fl=function(x,y,t,c){this.floats.push({x:x,y:y,t:t,c:c,l:750});};
Game.prototype.showBanner=function(){var el=document.getElementById('banner');el.textContent=this.ld?this.ld.name:'Level '+(this.lv+1);el.style.opacity='1';setTimeout(function(){el.style.opacity='0';},1600);};
Game.prototype.showDead=function(){document.getElementById('glvl').textContent=(this.lv+1)+'/50';document.getElementById('ggems').textContent=this.gems;document.getElementById('gov').style.display='flex';};
Game.prototype.hud=function(){
  var p=this.p;
  document.getElementById('hpfill').style.width=(p.hp/p.mhp*100)+'%';
  document.getElementById('ltxt').textContent=(this.lv+1)+'/50';
  document.getElementById('ztxt').textContent=this.ld?this.ld.zone.n:'-';
  document.getElementById('gtxt').textContent=this.gems+'💎';
  document.getElementById('stxt').textContent=this.score;
  document.getElementById('etxt').textContent=this.mons.filter(function(m){return !m.dead;}).length;
  document.getElementById('petbar').innerHTML=this.pets.map(function(pt){return'<div class="pi" title="'+pt.n+'">'+pt.e+'</div>';}).join('');
  document.getElementById('lvlmap').textContent='['+Array.from({length:50},function(_,i){return i<G.lv?'■':i===G.lv?'◆':'□';}).join('')+']';
};

Game.prototype.draw=function(){
  if(!this.map)return;
  var z=this.ld.zone,r,c,x,y;
  ctx.fillStyle=z.b;ctx.fillRect(0,GT,canvas.width,GH);
  for(r=0;r<this.R;r++)for(c=0;c<this.C;c++){
    x=c*T;y=GT+r*T;
    if(this.map[r][c]){ctx.fillStyle=z.w;ctx.fillRect(x,y,T,T);ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(x,y,T,2);}
    else{ctx.fillStyle=z.f;ctx.fillRect(x,y,T,T);if((r+c)%2===0){ctx.fillStyle='rgba(255,255,255,.012)';ctx.fillRect(x,y,T,T);}}
  }
  this.fx.forEach(function(f){ctx.globalAlpha=f.l/200;ctx.strokeStyle=f.c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();ctx.globalAlpha=1;});
  this.mons.forEach(function(m){
    if(m.dead)return;
    ctx.font='24px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(m.e,m.x,m.y);
    var bx=m.x-17,by=m.y-22;ctx.fillStyle='#400';ctx.fillRect(bx,by,34,4);ctx.fillStyle='#f33';ctx.fillRect(bx,by,Math.max(0,34*(m.hp/m.mhp)),4);
  });
  var p=this.p;
  if(!(p.inv>0&&Math.floor(p.inv/80)%2===0)){
    ctx.save();if(p.dir===-1){ctx.scale(-1,1);ctx.translate(-canvas.width,0);}
    var px2=p.dir===-1?canvas.width-p.x:p.x;
    ctx.font='28px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐻',px2,p.y);
    if(p.atk&&this.aa>0){ctx.font='16px serif';ctx.fillText('⚔️',px2+24,p.y-8);}
    ctx.restore();
  }
  var now=Date.now()/1000,pets=this.pets;
  pets.forEach(function(pt,i){var a=(i/Math.max(1,pets.length))*Math.PI*2+now*1.5;ctx.font='14px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(pt.e,p.x+Math.cos(a)*50,p.y+Math.sin(a)*28);});
  this.parts.forEach(function(pt){ctx.globalAlpha=Math.max(0,pt.l/600);ctx.fillStyle=pt.c;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.sz,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;});
  this.floats.forEach(function(f){ctx.globalAlpha=Math.min(1,f.l/250);ctx.fillStyle=f.c;ctx.font='bold 11px Courier New';ctx.textAlign='center';ctx.fillText(f.t,f.x,f.y);ctx.globalAlpha=1;});
  if(this.help&&Date.now()-this.t0<9000){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(canvas.width/2-165,canvas.height-64,330,48);
    ctx.fillStyle='#8070a0';ctx.font='10px Courier New';ctx.textAlign='center';
    ctx.fillText('Arrow keys/WASD = move   SPACE = attack',canvas.width/2,canvas.height-48);
    ctx.fillText('Kill monsters for 💎   Buy 50 pets in 🛒 SHOP!',canvas.width/2,canvas.height-32);
  }else if(Date.now()-this.t0>=9000)this.help=false;
};

function openShop(){if(!G||G.dead||G.win)return;G.open=true;renderShop();document.getElementById('ov').style.display='flex';}
function closeShop(){if(!G)return;G.open=false;document.getElementById('ov').style.display='none';}
function renderShop(){
  document.getElementById('sglbl').textContent=G.gems+'💎 gems';
  var cats={};PETS.forEach(function(pt){if(!cats[pt.cat])cats[pt.cat]=[];cats[pt.cat].push(pt);});
  var html='';
  Object.keys(cats).forEach(function(cat){
    html+='<div class="scat">'+cat+'</div><div class="sgrid">';
    cats[cat].forEach(function(pt){
      var own=G.pets.find(function(x){return x.id===pt.id;}),ca=!own&&G.gems<pt.cost;
      html+='<div class="sc'+(own?' own':'')+(ca?' ca':'')+'" onclick="'+(own||ca?'':'buyPet(\''+pt.id+'\')')+'"><div class="pe">'+pt.e+'</div><div class="pn">'+pt.n+'</div><div class="pd">'+pt.d+'</div><div class="pc">'+(own?'✅':'💎 '+pt.cost)+'</div></div>';
    });
    html+='</div>';
  });
  document.getElementById('sgrid').innerHTML=html;
}
function buyPet(id){var pt=PETS.find(function(p){return p.id===id;});if(!pt||G.gems<pt.cost||G.pets.find(function(x){return x.id===id;}))return;G.gems-=pt.cost;G.pets.push(pt);var n=Date.now();G.patk[id]=n;if(pt.hi>0)G.ptim[id]=n;renderShop();}
function restart(){document.getElementById('gov').style.display='none';document.getElementById('wov').style.display='none';G=new Game();}

var last=0;
function loop(ts){var dt=Math.min((ts-last)/1000,.05);last=ts;if(G){G.update(dt);ctx.clearRect(0,0,canvas.width,canvas.height);G.draw();}requestAnimationFrame(loop);}
rsz();G=new Game();requestAnimationFrame(function(ts){last=ts;loop(ts);});
</script>
