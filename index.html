<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Animal Friend RPG - 50 Levels & 50 Pets</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="stat"><div class="lbl">HP</div><div id="hpbar"><div id="hpfill"></div></div></div>
    <div class="stat"><div class="lbl">LEVEL</div><span id="ltxt">1/50</span></div>
    <div class="stat"><div class="lbl">ZONE</div><span id="ztxt" style="color:#d0b0ff">-</span></div>
    <div class="stat"><div class="lbl">GEMS</div><span id="gtxt" style="color:#ffd700">0💎</span></div>
    <div class="stat"><div class="lbl">SCORE</div><span id="stxt">0</span></div>
    <div class="stat"><div class="lbl">ENEMIES</div><span id="etxt" style="color:#ff7070">0</span></div>
    <div class="stat" style="margin-left:auto"><div class="lbl">PETS</div><div id="petbar"></div></div>
  </div>

  <div id="banner"></div>
  <div id="shopbtn"><button class="btn" onclick="openShop()" style="font-size:10px;padding:4px 12px">🛒 SHOP (50 pets!)</button></div>
  <div id="lvlmap"></div>

  <div id="ov">
    <div class="otitle">🛒 Shop — <span id="sglbl">0💎</span></div>
    <div class="scat upgrade">⚡ Upgrades</div>
    <div id="upgrid"></div>
    <div class="scat attacker" style="margin-top:10px">🐾 Pets</div>
    <div id="sgrid"></div>
    <button class="btn" style="margin:14px auto;display:block" onclick="closeShop()">▶ Back to Game</button>
  </div>

  <div id="gov">
    <div class="otitle" style="color:#ff5050">💀 YOU DIED</div>
    <div style="color:#c888e0;font-size:14px;margin-bottom:6px">Level reached: <span id="glvl" style="color:#ffd700"></span></div>
    <div style="color:#c888e0;font-size:14px;margin-bottom:18px">Gems collected: <span id="ggems" style="color:#ffd700"></span></div>
    <button class="btn" onclick="restart()">Try Again</button>
  </div>

  <div id="wov">
    <div class="otitle" style="color:#ffd700">🏆 ULTIMATE CHAMPION!</div>
    <div style="color:#e090ff;font-size:14px;margin-bottom:8px">All 50 dungeons conquered!</div>
    <div style="color:#e090ff;font-size:14px;margin-bottom:18px">Final Score: <span id="wscore" style="color:#ffd700"></span></div>
    <button class="btn btng" onclick="restart()">Play Again</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
