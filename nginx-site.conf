# /etc/nginx/sites-available/animalfriend
# Symlink: ln -s /path/to/nginx-site.conf /etc/nginx/sites-available/animalfriend
#          ln -s /etc/nginx/sites-available/animalfriend /etc/nginx/sites-enabled/animalfriend

server {
    listen 80;
    server_name _;                         # replace with your domain/IP if needed

    root "/home/ethan/Documents/animal friend";
    index index.html;

    # Static files served directly by nginx — fast, no FastCGI overhead
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # All /api/ requests go to the FastCGI C++ program
    location /api/ {
        include        fastcgi_params;
        fastcgi_pass   unix:/run/animalfriend/api.sock;

        # Standard CGI variables
        fastcgi_param  REQUEST_METHOD   $request_method;
        fastcgi_param  REQUEST_URI      $request_uri;
        fastcgi_param  CONTENT_TYPE     $content_type;
        fastcgi_param  CONTENT_LENGTH   $content_length;

        # Forward the custom auth headers the game client sends
        fastcgi_param  HTTP_X_NAME      $http_x_name;
        fastcgi_param  HTTP_X_TOKEN     $http_x_token;

        fastcgi_read_timeout 30s;
        fastcgi_buffer_size  16k;
        fastcgi_buffers      4 16k;
    }
}
